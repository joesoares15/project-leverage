name: Build data and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 2"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate Python and unit tests
        run: |
          python -m py_compile scripts/build_anyrb_data.py
          PYTHONPATH=. pytest -q

      - name: Build bundled PL-001 dataset
        env:
          NFLREADPY_CACHE: filesystem
          NFLREADPY_CACHE_DIR: .nflreadpy-cache
          NFLREADPY_TIMEOUT: "120"
        run: python scripts/build_anyrb_data.py --seasons 2019-2024 --output site/data/anyrbona53.json

      - name: Validate generated dataset
        run: python scripts/validate_anyrb_output.py site/data/anyrbona53.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
